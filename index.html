<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Changer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header><div><span class="dot"></span><span class="eyebrow">LIVE AUDIO LAB</span><h1>Voice Changer</h1><p>Real-time browser voice effects. Your microphone stays in your browser.</p></div><div id="status" class="status">OFFLINE</div></header>
    <section class="card controls">
      <div class="row"><button id="start">🎙️ Start Mic</button><button id="stop" disabled>⏹ Stop</button><button id="mute" disabled>🔇 Mute</button></div>
      <label>Effect<select id="effect"><option value="normal">Normal</option><option value="deep">Deep</option><option value="high">High</option><option value="robot">Robot</option><option value="alien">Alien</option><option value="radio">Radio</option></select></label>
      <label>Pitch <output id="pitchOut">0 st</output><input id="pitch" type="range" min="-12" max="12" step="0.5" value="0"></label>
      <label>Effect amount <output id="amountOut">60%</output><input id="amount" type="range" min="0" max="100" value="60"></label>
      <div class="meter"><span id="meterFill"></span></div><small id="meterText">Mic level: 0%</small>
    </section>
    <section class="card info"><b>⚡ How it works</b><span>Microphone → pitch/effect processing → browser audio output.</span><span class="warn">For microphone access, use HTTPS (GitHub Pages) or localhost.</span></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
